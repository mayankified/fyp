<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style> 
    body { font-family: Arial; text-align: center; padding: 20px;} 
    img { max-width: 100%; border: 1px solid #ccc; margin-top: 10px; } 
    .controls { margin-top: 15px; padding: 10px; border: 1px solid #eee; display: inline-block;}
    label { font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Live Detection Viewer</h3>
  
  <div class="controls">
      <label>
          <input type="checkbox" id="toggleAi" checked> 
          Enable AI Detection
      </label>
  </div>

  <div>
    <p>Status: <span id="status">Waiting for connection...</span></p>
    <img id="frameImg" src="" alt="Waiting for stream..."/>
  </div>

<script>
const socket = io();
const status = document.getElementById('status');
const img = document.getElementById('frameImg');
const toggleAi = document.getElementById('toggleAi');

socket.on('connect', () => {
    status.innerText = "Connected. Waiting for Mobile to start stream...";
});

// Toggle Detection Logic
toggleAi.addEventListener('change', (e) => {
    const isEnabled = e.target.checked;
    socket.emit('toggle_detection', { enabled: isEnabled });
});

socket.on('stream_ready', (data) => {
    status.innerText = "Status: " + data.message;
});

socket.on('annotated_frame', (msg) => {
  if (msg && msg.image) {
      img.src = msg.image;
      status.innerText = "Status: Receiving Live Feed";
  }
});
</script>
</body>
</html>
