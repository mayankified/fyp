<!-- templates/viewer.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"
    integrity="sha384-+q8H8gEy7aY4u+1em/8w7b0a0w5hZ9m5p+0I08m8p1cJzqgQF9fBq3Xw5bE6v8c7"
    crossorigin="anonymous"></script>
  <style> body { font-family: Arial; } img { max-width: 100%; } </style>
</head>
<body>
  <h3>Live Detection Viewer</h3>
  <p>Enter stream session id (leave blank to auto-join last connected mobile session):</p>
  <input id="roomInput" placeholder="session id (optional)" style="width:60%"/>
  <button id="joinBtn">Join</button>
  <div>
    <p>Status: <span id="status">idle</span></p>
    <img id="frameImg" src="" alt="annotated frame will appear here"/>
  </div>

<script>
const socket = io();
const status = document.getElementById('status');
const img = document.getElementById('frameImg');
const joinBtn = document.getElementById('joinBtn');
const roomInput = document.getElementById('roomInput');

let currentRoom = null;

joinBtn.addEventListener('click', () => {
  const r = roomInput.value.trim();
  if (!r) {
    alert("If you leave blank, you'll automatically view the latest stream (server must support it). You can also paste the mobile session id.");
  }
  // join a room by asking server to join (we use same connect->room approach by telling server to join)
  // Simple approach: we rely on the server emitting frames to a room name equal to the mobile session id.
  // So to view, just tell server to bind this socket to that room.
  const room = r || null;
  fetch('/_join_room', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({room})})
    .then(res => res.json())
    .then(data => {
      if(data.ok){
        currentRoom = data.room;
        status.innerText = 'joined ' + currentRoom;
      } else {
        status.innerText = 'failed to join';
      }
    })
    .catch(e => { status.innerText = 'error'; console.error(e); });
});

// fallback: server may broadcast to all viewers if room not provided; we just listen:
socket.on('annotated_frame', (msg) => {
  if (msg && msg.image){
    img.src = msg.image;
  }
});
</script>
</body>
</html>
